# ============================================================
# TreatLife SS02 — 3-Way Smart Switch (SS02 + dumb traveler)
# ============================================================
# Hardware:
#   Module        — ESP8266 / TYWE3S
#   Board target  — esp01_1m (see boards/esp01_1m.yaml)
#   Control       — Direct GPIO. No Tuya MCU; ESPHome drives the relay
#                   and LEDs itself.
#
# GPIO Pinout:
#   GPIO4   — White LED (relay state indicator, inverted)
#   GPIO5   — Red LED   (Wi-Fi / status indicator, inverted)
#   GPIO12  — Relay output
#   GPIO13  — Physical button on smart switch (inverted)
#   GPIO14  — Traveler input from dumb 3-way switch (inverted)
#
# In service:
#   Stairwell lighting. This SS02 is at one end; a conventional
#   (non-smart) 3-way switch sits at the bottom of the stairs.
#
# How the 3-way logic works — read before editing:
#   In a 3-way circuit the load state depends on BOTH switches, so the
#   relay position alone does not tell you whether the light is on.
#   GPIO14 senses the traveler line and is the real source of truth.
#   The template switch below reports power_sensor (not the relay) as
#   its state, and its turn_on/turn_off actions toggle the relay only
#   when the sensed state doesn't already match the request. Flipping
#   the dumb switch changes power_sensor without ESPHome doing anything,
#   and Home Assistant follows along correctly.
#   The 50ms delayed_off filter debounces traveler transitions.
#
# Notes specific to this device:
#   - The white LED is driven inverse to the sensed load state, so the
#     switch is findable in a dark stairwell.
#   - The red LED is bound to status_led (Wi-Fi/API health) and is not
#     separately controllable.
#   - relay and the GPIO button are internal: True — only the template
#     switch is exposed to Home Assistant, so HA can't desync the logic
#     by driving the relay directly.
# ============================================================

substitutions:
  device_name: treatlife-ss02-3way
  friendly_devicename: Treatlife SS02 3-Way
  comment: "Treatlife 3 Way Smart Switch (SS02)"
  default_update_interval: 60s

# ---- Shared includes -----------------------------------------
<<: !include boards/esp01_1m.yaml
<<: !include components/api.yaml
<<: !include components/captive_portal.yaml
<<: !include components/logger.yaml
<<: !include components/mdns.yaml
<<: !include components/ota/esphome.yaml
<<: !include components/safe_mode.yaml
<<: !include components/web_server.yaml
<<: !include components/wifi_auth.yaml

# ── Binary Sensors ───────────────────────────────────────────
binary_sensor:
  - <<: !include components/binary_sensor/status.yaml
  # Physical button on the SS02 itself
  - platform: gpio
    id: smart_switch_button
    pin:
      number: GPIO13
      inverted: true
    internal: true
    on_press:
      then:
        - switch.toggle: relay
    
  # Traveler sense from the dumb switch — the real load state.
  # See the 3-way logic note in the header.
  - platform: gpio
    id: power_sensor
    pin:
      number: GPIO14
      inverted: true
    internal: true
    filters:
      - delayed_off: 50ms
    on_press:
      - light.turn_off: white_led
    on_release:
      - light.turn_on: white_led

# ── Buttons ──────────────────────────────────────────────────
button:
  - platform: restart
    name: "Reboot"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Reboot Safe Mode"
    entity_category: diagnostic

# ── Lights ───────────────────────────────────────────────────
light:
  # White LED mirrors relay state
  - platform: binary
    id: white_led
    output: white_led_output
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

# ── Outputs ──────────────────────────────────────────────────
output:
  # White LED — mirrors relay state (on when light is on)
  - platform: gpio
    id: white_led_output
    pin:
      number: GPIO4
      inverted: True

# ── Sensors ──────────────────────────────────────────────────
sensor:
  - <<: !include components/sensor/wifi_signal.yaml
  - <<: !include components/sensor/uptime.yaml

# ── Status LED (Red LED = Wi-Fi/API health indicator) ────────
status_led:
  pin: 
    number: GPIO5  # Red LED
    inverted: True

# ── Switches ─────────────────────────────────────────────────
# relay is internal; the template switch below is the HA-facing
# entity and reports the SENSED load state, not the relay position.
switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF
    internal: True

  - platform: template
    name: ""
    id: light_switch
    lambda: |-
      if (id(power_sensor).state) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
    - if:
        condition:
          - binary_sensor.is_off: power_sensor
        then:
          - switch.toggle: relay
    turn_off_action:
    - if:
        condition:
          - binary_sensor.is_on: power_sensor
        then:
          - switch.toggle: relay

text_sensor:
  - <<: !include components/text_sensor/wifi_info.yaml
