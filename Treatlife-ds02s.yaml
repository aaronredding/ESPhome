# ============================================================
# TreatLife DS02S — Single-Pole Smart Dimmer Switch
# ============================================================
# Hardware:
#   Module        — WB3S (Beken BK7231T)
#   Board target  — generic-bk7231t-qfn32-tuya (see boards/wb3s-ds02s.yaml)
#   Control       — TuyaMCU (Nuvoton) over UART. ESPHome does not drive
#                   the triac; the MCU owns dimming and is driven
#                   entirely through datapoints.
#
# UART / MCU:
#   GPIO10 — RX     GPIO11 — TX     115200 baud
#   rx_buffer_size is raised to 512 for this MCU's chattier dp stream.
#
# Flashing:
#   Converted with Tuya-CloudCutter.
#   https://github.com/tuya-cloudcutter/tuya-cloudcutter
#
# Notes specific to this device:
#   - This device needs its own esphome: core block rather than the
#     shared components/esphome.yaml, because of the on_boot select
#     re-assertion and the platformio_options override. Both live in
#     components/esphome_ds02s.yaml, pulled in via boards/wb3s-ds02s.yaml.
#   - platformio_options lib_ignore: RPAsyncTCP is required; without it
#     the build pulls a conflicting async TCP library on this platform.
#   - on_boot forces load_type and indicator_led back to index 0. The
#     Tuya MCU does not reliably restore these across a power cycle.
#   - The indicator LED select uses int_datapoint (104), not
#     enum_datapoint, because the MCU reports it as an int.
#
# Tuya datapoints (dpIDs):
#   1   — switch (on/off)
#   2   — dimmer level
#   3   — minimum brightness (1% = 10, 100% = 1000)
#   4   — dimming mode / load type: LED / incandescent / halogen
#   101 — led_bright low / wake_up (observed value AAAA)
#   102 — count_down (observed value 0)
#   103 — bright_value_3 (observed value 10)
#   104 — LED indicator mode: Opposite / Follow
#   105 — random time
# ============================================================

substitutions:
  device_name: treatlife-ds02s
  friendly_devicename: Treatlife DS02S Dimmer
  comment: "Treatlife Single Pole Smart Dimmer Switch (DS02S)"
  default_update_interval: 60s

# ---- Shared includes -----------------------------------------
<<: !include boards/wb3s-ds02s.yaml
<<: !include components/api.yaml
<<: !include components/captive_portal.yaml
<<: !include components/logger.yaml
<<: !include components/mdns.yaml
<<: !include components/ota/esphome.yaml
<<: !include components/safe_mode.yaml
<<: !include components/time/sntp-local.yaml
<<: !include components/web_server.yaml
<<: !include components/wifi.yaml

# ---- TuyaMCU -------------------------------------------------
# Loads the Tuya library and pushes network time down to the MCU.
tuya:
  time_id: sntp_time

# ---- UART ----------------------------------------------------
# Link to the Tuya MCU. Buffer raised for this MCU's dp stream.
uart:
  rx_pin: GPIO10
  tx_pin: GPIO11
  baud_rate: 115200
  rx_buffer_size: 512

# ---- Binary Sensors ------------------------------------------
binary_sensor:
  - <<: !include components/binary_sensor/status.yaml

# ---- Lights --------------------------------------------------
# The dimmable load. Restores OFF rather than resuming prior state.
light:
  - platform: "tuya"
    name: ""
    id: light_id
    dimmer_datapoint: 2
    switch_datapoint: 1
    min_value: 10
    max_value: 1000
    restore_mode: RESTORE_DEFAULT_OFF

# ---- Numbers (config entities) -------------------------------
# Dimming floor for loads that cut out at the bottom of the range.
number:
  - platform: "tuya"
    id: min_brightness
    name: "Min Brightness"
    number_datapoint: 3
    min_value: 10
    max_value: 100
    step: 10
    entity_category: config

# ---- Buttons -------------------------------------------------──────
button:
  - platform: restart
    name: "Reboot"
    entity_category: diagnostic

  - platform: safe_mode
    name: "Reboot Safe Mode"
    entity_category: diagnostic

# ---- Selects (config entities) -------------------------------
# load_type picks the MCU dimming curve (wrong setting = flicker or
# buzz). indicator_led sets whether the LED follows or opposes the
# load. Both are re-asserted in on_boot — see header.
select:
  - platform: "tuya"
    id: load_type
    name: "Load Type"
    enum_datapoint: 4
    options:
      0: "LED"
      1: "Incandescent"
      2: "Halogen"
    entity_category: config

  - platform: "tuya"
    id: indicator_led
    name: "Indicator Mode"
    int_datapoint: 104
    options:
      0: "Opposite"
      1: "Follow"
    entity_category: config


# ---- Sensors -------------------------------------------------
sensor:
  - <<: !include components/sensor/wifi_signal.yaml
  - <<: !include components/sensor/uptime.yaml

# ---- Text Sensors --------------------------------------------
text_sensor:
  - <<: !include components/text_sensor/wifi_info.yaml
